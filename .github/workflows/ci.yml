name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.os }}, C++${{ matrix.std }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        std: [17, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            zlib1g-dev

      - name: Build and install wfrest (bundles workflow)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/wfrest/wfrest.git "$RUNNER_TEMP/wfrest"
          make -C "$RUNNER_TEMP/wfrest" -j"$(nproc)"
          sudo make -C "$RUNNER_TEMP/wfrest" install
          test -f /usr/local/lib/cmake/wfrest/wfrest-targets.cmake

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DWFREST_SOURCE_DIR="$RUNNER_TEMP/wfrest"

      - name: Build
        run: |
          cmake --build build --parallel $(nproc)

      - name: Smoke test - start server and ping
        run: |
          ./build/wfrest_server 8080 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 15); do
            curl -sf http://127.0.0.1:8080/ping >/dev/null && break
            sleep 1
          done

          echo "--- /ping ---"
          curl -sS http://127.0.0.1:8080/ping
          curl -sS http://127.0.0.1:8080/ping | grep -q pong

          echo "--- /json ---"
          JSON=$(curl -sS http://127.0.0.1:8080/json)
          echo "$JSON"
          echo "$JSON" | grep -q '"message"'
          echo "$JSON" | grep -q '"status"'

          echo "--- /echo (POST) ---"
          ECHO=$(curl -sS -X POST -d "hello wfrest" http://127.0.0.1:8080/echo)
          echo "$ECHO"
          test "$ECHO" = "hello wfrest"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfrest_server-${{ matrix.os }}-cpp${{ matrix.std }}
          path: build/wfrest_server
          if-no-files-found: warn
